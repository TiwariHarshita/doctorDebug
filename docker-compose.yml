services:
  postgres:
    image: postgres:16
    container_name: debugpilot-postgres
    restart: always
    environment:
      POSTGRES_USER: debugpilot
      POSTGRES_PASSWORD: debugpilot
      POSTGRES_DB: debugpilot_db
    ports:
      - "5432:5432"
    volumes:
      - debugpilot_postgres_data:/var/lib/postgresql/data

volumes:
  debugpilot_postgres_data: